server:
  port: 8087
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/usuariosdb
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # <- Se borra y recrea la DB en cada ejecución
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
# <- ESTA es la clave para que espere a que Hibernate cree las tablas

spring.sql.init.mode: always  # <- Esto asegura que spring ejecute data.sql

spring.jpa.properties.hibernate.format_sql: true
logging.level.org.hibernate.SQL: DEBUG