server:
  port: 8088
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # <- Se borra y recrea la DB en cada ejecución
    show-sql: true
# <- ESTA es la clave para que espere a que Hibernate cree las tablas

spring.sql.init.mode: always  # <- Esto asegura que spring ejecute data.sql
